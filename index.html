<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>yanote ⚡ Editor Markdown</title>
    <script>
      // Apply the last theme before the app loads so a reload doesn't flash a light background
      try {
        if (localStorage.getItem('yanote:darkMode') === '1') document.documentElement.classList.add('dark');
      } catch {}
    </script>
    <style>
      html { background-color: #faf8f5; }
      html.dark, html.dark body { background-color: #121212; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
