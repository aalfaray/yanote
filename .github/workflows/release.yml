name: Release

# Push a tag like v1.2.0 (matching package.json "version") to build and publish
# the Windows installer + portable to GitHub Releases. Installed copies of yanote
# pick the new version up through latest.yml and offer to update.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches package.json
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::La etiqueta v$TAG no coincide con package.json ($PKG). Usa: npm version $TAG"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Build and publish installer + portable
        run: npx electron-builder --win nsis portable --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The annotated tag message becomes the release notes shown in the app's update dialog.
      # Read through the API: actions/checkout turns annotated tags into lightweight ones.
      - name: Release notes from the tag message
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REF=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          TYPE=$(echo "$REF" | jq -r .object.type)
          if [ "$TYPE" = "tag" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$(echo "$REF" | jq -r .object.sha)" --jq .message | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > notes.md
          else
            : > notes.md
          fi
          if [ -s notes.md ]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "yanote $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "yanote $GITHUB_REF_NAME"
          fi
